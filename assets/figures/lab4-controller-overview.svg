  <title
     id="title">How the transport slice controller puts earlier labs together</title>
  <desc
     id="desc">A slice request feeds a transport slice controller. The controller reuses the ideas from Lab 1, Lab 2, and Lab 3 to realize a slice with a chosen path, chosen waypoints, and chosen traffic treatment.</desc>
