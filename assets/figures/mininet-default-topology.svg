<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">Default Mininet topology</title>
  <desc id="desc">The topology started by sudo mn: host h1 connected to switch s1, and switch s1 connected to host h2.</desc>
  <defs>
    <style>
      .bg { fill: #fcfbf8; }
      .link { stroke: #65717d; stroke-width: 10; stroke-linecap: round; fill: none; }
      .host { fill: #e4f1ec; stroke: #0d6a59; stroke-width: 4; }
      .switch { fill: #e9eef2; stroke: #33424f; stroke-width: 4; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #181b1f; dominant-baseline: middle; text-anchor: middle; }
      .subtle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 600; fill: #505861; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="760" height="260" rx="28"/>
  <path class="link" d="M170 130 H325"/>
  <path class="link" d="M435 130 H590"/>

  <rect class="host" x="80" y="92" width="90" height="76" rx="18"/>
  <text class="label" x="125" y="130">h1</text>

  <rect class="switch" x="325" y="85" width="110" height="90" rx="18"/>
  <text class="label" x="380" y="130">s1</text>

  <rect class="host" x="590" y="92" width="90" height="76" rx="18"/>
  <text class="label" x="635" y="130">h2</text>

  <text class="subtle" x="380" y="215">default topology started by sudo mn</text>
</svg>
