  <title
     id="title">Lab 4 slice topology</title>
  <desc
     id="desc">Hosts h1 and h3 connect to switch s1, which connects to switch s2 and then h2. Four middleboxes mb1, mb2, mb3, and mb4 all attach directly to s2, with mb1 and mb2 above and mb3 and mb4 below.</desc>
