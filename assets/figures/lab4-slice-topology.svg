<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Lab 4 slice topology</title>
  <desc id="desc">Hosts h1 and h3 connect to switch s1. Switch s1 connects directly to switch s2 over a slower 30 millisecond, 10 megabit bottleneck link. A faster alternate path goes from s1 through dual-homed router r1 to s2 over two 5 millisecond links. Host h2 plus waypoints mb1 and mb2 attach to s2.</desc>
  <defs>
    <style>
      .bg { fill: #fcfbf8; }
      .link { stroke-width: 10; stroke-linecap: round; fill: none; }
      .edge { stroke: #65717d; }
      .slow { stroke: #c65d1b; }
      .fast { stroke: #2f63c7; }
      .host { fill: #e4f1ec; stroke: #0d6a59; stroke-width: 4; }
      .switch { fill: #e9eef2; stroke: #33424f; stroke-width: 4; }
      .service { fill: #fff6db; stroke: #9a6700; stroke-width: 4; }
      .router { fill: #edf2ff; stroke: #3559b8; stroke-width: 4; }
      .label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 28px;
        font-weight: 700;
        fill: #181b1f;
        dominant-baseline: middle;
        text-anchor: middle;
      }
      .note {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 17px;
        font-weight: 600;
        fill: #6b4a10;
        text-anchor: middle;
      }
      .metric {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 18px;
        font-weight: 700;
        text-anchor: middle;
      }
      .metric-slow { fill: #9b430f; }
      .metric-fast { fill: #234a99; }
    </style>
  </defs>

  <rect class="bg" width="980" height="430" rx="28" />

  <path class="link edge" d="M170 180 H315" />
  <path class="link edge" d="M170 318 L315 225" />
  <path class="link slow" d="M425 180 H575" />
  <path class="link edge" d="M685 180 H830" />
  <path class="link edge" d="M630 135 V76" />
  <path class="link edge" d="M630 225 L730 274" />
  <path class="link fast" d="M365 225 L447 302" />
  <path class="link fast" d="M635 225 L553 302" />

  <rect class="host" x="80" y="142" width="90" height="76" rx="18" />
  <text class="label" x="125" y="180">h1</text>

  <rect class="host" x="80" y="280" width="90" height="76" rx="18" />
  <text class="label" x="125" y="318">h3</text>

  <rect class="switch" x="315" y="135" width="110" height="90" rx="18" />
  <text class="label" x="370" y="180">s1</text>

  <rect class="switch" x="575" y="135" width="110" height="90" rx="18" />
  <text class="label" x="630" y="180">s2</text>

  <rect class="host" x="830" y="142" width="90" height="76" rx="18" />
  <text class="label" x="875" y="180">h2</text>

  <rect class="service" x="565" y="24" width="130" height="52" rx="16" />
  <text class="label" x="630" y="50">mb1</text>
  <text class="note" x="744" y="56">telemetry</text>

  <rect class="service" x="665" y="274" width="130" height="52" rx="16" />
  <text class="label" x="730" y="300">mb2</text>
  <text class="note" x="730" y="348">security</text>

  <rect class="router" x="445" y="268" width="110" height="76" rx="18" />
  <text class="label" x="500" y="308">r1</text>

  <text class="metric metric-slow" x="500" y="150">30 ms / 10 Mbps</text>
  <text class="metric metric-fast" x="434" y="255">5 ms</text>
  <text class="metric metric-fast" x="567" y="255">5 ms</text>
</svg>
