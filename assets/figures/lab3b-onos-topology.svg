      .delay { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; }
      .delay-slow { fill: #9b430f; }
      .delay-fast { fill: #234a99; }
    </style>
