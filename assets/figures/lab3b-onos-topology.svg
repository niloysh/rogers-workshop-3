  <title
     id="title">Lab 3b topology</title>
  <desc
     id="desc">Host h1 connects to switch s1. Host h2 plus service nodes mb1 and mb2 connect to switch s2. A dual-homed router r1 connects to both switches, creating a fast alternate path while the direct s1 to s2 link carries higher delay.</desc>
