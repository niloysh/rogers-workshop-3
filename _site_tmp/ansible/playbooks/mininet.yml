# playbooks/mininet.yml
---
- name: Install Mininet and OVS
  hosts: workshop_vms
  become: true
  gather_facts: true

  tasks:
    - name: Install Mininet, OVS, and network tools
      ansible.builtin.apt:
        name:
          - mininet
          - openvswitch-switch
          - openvswitch-common
          - net-tools
          - iproute2
          - iputils-ping
          - curl
          - wget
          - iperf
          - iperf3
          - hping3
          - tcpdump
          - iptables
        state: present
        update_cache: true

    - name: Enable and start OVS
      ansible.builtin.systemd:
        name: openvswitch-switch
        enabled: true
        state: started

  # ────────────────────────────────────────────
  # SRv6 KERNEL ENABLEMENT
  # ────────────────────────────────────────────
    - name: Check kernel config for built-in SRv6 support
      ansible.builtin.shell: |
        for mod in seg6_iptunnel seg6_local; do
          if grep -qE "^CONFIG_IPV6_SEG6.*=y" /boot/config-$(uname -r) 2>/dev/null; then
            echo "${mod}=builtin"
          elif modinfo "$mod" &>/dev/null; then
            echo "${mod}=module"
          else
            echo "${mod}=missing"
          fi
        done
      register: srv6_module_check
      changed_when: false

    - name: Print SRv6 module availability
      ansible.builtin.debug:
        msg: "{{ srv6_module_check.stdout_lines }}"

    - name: Install HWE kernel if SRv6 modules are missing
      ansible.builtin.apt:
        name:
          - linux-generic-hwe-22.04
          - linux-headers-generic-hwe-22.04
        state: present
        update_cache: true
      when: "'missing' in srv6_module_check.stdout"
      register: hwe_kernel_installed

    - name: Reboot to load HWE kernel
      ansible.builtin.reboot:
        msg: "Rebooting to activate HWE kernel with SRv6 support"
        reboot_timeout: 120
      when: hwe_kernel_installed is changed

    - name: Load SRv6 modules if loadable
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - seg6_iptunnel
        - seg6_local
      when: "'module' in srv6_module_check.stdout"

    - name: Apply SRv6 sysctl settings
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-srv6.conf
        mode: "0644"
        content: |
          net.ipv6.conf.all.forwarding = 1
          net.ipv6.conf.default.forwarding = 1
          net.ipv6.conf.all.seg6_enabled = 1
          net.ipv6.conf.default.seg6_enabled = 1
          net.ipv6.seg6_require_hmac = 0

    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true

    - name: Verify Mininet
      ansible.builtin.command: mn --version
      register: mn_version
      changed_when: false

    - name: Print summary
      ansible.builtin.debug:
        msg:
          - "Mininet: {{ mn_version.stdout }}"
          - "SRv6:    {{ srv6_module_check.stdout_lines }}"
          - "OVS:     ready"
