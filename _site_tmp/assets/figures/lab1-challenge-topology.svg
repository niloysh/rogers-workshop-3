  <title
     id="title">Lab 1 challenge topology</title>
  <desc
     id="desc">Host h1 connects to switch s1. Switch s1 connects to s2 and s3. Switches s2 and s3 both connect to s4. Host h2 connects to s2 and host h3 connects to s4.</desc>
