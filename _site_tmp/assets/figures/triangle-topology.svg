<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 920 520"
   role="img"
   aria-labelledby="title desc"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <title id="title">Triangle topology</title>
  <desc id="desc">Hosts h1, h2, and h3 attach to switches s1, s2, and s3. Switches s1, s2, and s3 form a triangle.</desc>
  <defs>
    <style>
      .bg { fill: #fcfbf8; }
      .link { stroke: #65717d; stroke-width: 10; stroke-linecap: round; fill: none; }
      .host { fill: #e4f1ec; stroke: #0d6a59; stroke-width: 4; }
      .switch { fill: #e9eef2; stroke: #33424f; stroke-width: 4; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #181b1f; dominant-baseline: middle; text-anchor: middle; }
      .subtle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 600; fill: #505861; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="920" height="520" rx="28" />

  <path class="link" d="M170 130 H300" />
  <path class="link" d="M410 130 H510" />
  <path class="link" d="M620 130 H750" />
  <path class="link" d="M345 175 L438 268" />
  <path class="link" d="M565 175 L448 268" />
  <path class="link" d="M448 358 V430" />

  <rect class="host" x="80" y="92" width="90" height="76" rx="18" />
  <text class="label" x="125" y="130">h1</text>

  <rect class="switch" x="300" y="85" width="110" height="90" rx="18" />
  <text class="label" x="355" y="130">s1</text>

  <rect class="switch" x="510" y="85" width="110" height="90" rx="18" />
  <text class="label" x="565" y="130">s2</text>

  <rect class="host" x="750" y="92" width="90" height="76" rx="18" />
  <text class="label" x="795" y="130">h2</text>

  <rect class="switch" x="393" y="268" width="110" height="90" rx="18" />
  <text class="label" x="448" y="313">s3</text>

  <rect class="host" x="403" y="430" width="90" height="76" rx="18" />
  <text class="label" x="448" y="468">h3</text>

  <text class="subtle" x="460" y="36">three OVS switches in a triangle with one host on each edge switch</text>
</svg>
