<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc">
  <title id="title">Lab 3 service-chain topology</title>
  <desc id="desc">Hosts h1 and h2 connect through switches s1 and s2. Service waypoints mb1 and mb2 both attach directly to switch s2.</desc>
  <defs>
    <style>
      .bg { fill: #fcfbf8; }
      .link { stroke: #65717d; stroke-width: 10; stroke-linecap: round; fill: none; }
      .host { fill: #e4f1ec; stroke: #0d6a59; stroke-width: 4; }
      .switch { fill: #e9eef2; stroke: #33424f; stroke-width: 4; }
      .service { fill: #fff6db; stroke: #9a6700; stroke-width: 4; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #181b1f; dominant-baseline: middle; text-anchor: middle; }
      .subtle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 600; fill: #505861; text-anchor: middle; }
      .note { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 600; fill: #6b4a10; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="840" height="360" rx="28"/>

  <path class="link" d="M170 150 H315"/>
  <path class="link" d="M425 150 H555"/>
  <path class="link" d="M665 150 H790"/>
  <path class="link" d="M610 105 V54"/>
  <path class="link" d="M610 195 V246"/>

  <rect class="host" x="80" y="112" width="90" height="76" rx="18"/>
  <text class="label" x="125" y="150">h1</text>

  <rect class="switch" x="315" y="105" width="110" height="90" rx="18"/>
  <text class="label" x="370" y="150">s1</text>

  <rect class="switch" x="555" y="105" width="110" height="90" rx="18"/>
  <text class="label" x="610" y="150">s2</text>

  <rect class="host" x="700" y="112" width="90" height="76" rx="18"/>
  <text class="label" x="745" y="150">h2</text>

  <rect class="service" x="545" y="10" width="130" height="52" rx="16"/>
  <text class="label" x="610" y="36">mb1</text>
  <text class="note" x="610" y="88">waypoint 1</text>

  <rect class="service" x="545" y="246" width="130" height="52" rx="16"/>
  <text class="label" x="610" y="272">mb2</text>
  <text class="note" x="610" y="324">IDS</text>
  <text class="subtle" x="420" y="338">both service nodes attach directly to s2</text>
</svg>
